# This workflow runs nightly and can also be triggered manually.

name: Nightly workflow

on:
  schedule:
    - cron: '0 2 * * *'  # Every day at 02:00 UTC
  workflow_dispatch:

jobs:
  nightly-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create nightly output
        run: |
          mkdir -p nightly-output
          echo "Nightly workflow started at $(date -u)" > nightly-output/nightly-run.txt
          echo "Repository: $GITHUB_REPOSITORY" >> nightly-output/nightly-run.txt
          echo "Run ID: $GITHUB_RUN_ID" >> nightly-output/nightly-run.txt

      - name: Upload nightly artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-output-${{ github.run_number }}
          path: nightly-output/
          if-no-files-found: error
          retention-days: 30
